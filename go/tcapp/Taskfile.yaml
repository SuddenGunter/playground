version: "3"

dotenv: ["tcapp.env"]

vars:
  BIN: ./bin/tcapp
  # docker or podman; override with `task COMPOSE="docker compose" db:up`.
  COMPOSE: '{{.COMPOSE | default "podman compose"}}'

tasks:
  build:
    desc: Build the binary
    cmds:
      - go build -trimpath -o {{.BIN}} .

  run:
    desc: Run locally against the compose database (reads tcapp.env if present)
    env:
      PORT: '{{.PORT | default "8080"}}'
      DATABASE_URL: '{{.DATABASE_URL | default "postgres://tcapp:tcapp@127.0.0.1:5432/tcapp?sslmode=disable"}}'
    cmds:
      - go run .

  test:
    desc: Run unit tests (no containers needed)
    cmds:
      - go test -race -count=1 ./...

  test:integration:
    desc: Run unit + integration tests (starts Postgres via testcontainers)
    env:
      # Defaults target rootless podman. With Docker, override DOCKER_HOST (or unset it in tcapp.env).
      DOCKER_HOST: '{{.DOCKER_HOST | default (printf "unix://%s/podman/podman.sock" (env "XDG_RUNTIME_DIR"))}}'
      # Rootless podman can't stop API-started containers cleanly; privileged Ryuk force-removes them.
      TESTCONTAINERS_RYUK_CONTAINER_PRIVILEGED: '{{.TESTCONTAINERS_RYUK_CONTAINER_PRIVILEGED | default "true"}}'
    cmds:
      - go test -race -count=1 -tags integration ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format code (gofumpt + goimports)
    cmds:
      - golangci-lint fmt

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  db:up:
    desc: Start the local Postgres
    cmds:
      - '{{.COMPOSE}} up -d --wait'

  db:down:
    desc: Stop the local Postgres (add -- -v to also drop its data)
    cmds:
      - '{{.COMPOSE}} down {{.CLI_ARGS}}'

  docker:local:
    desc: Build an image for the host platform and load it into docker
    cmds:
      - docker buildx build --load -t {{.IMAGE | default "tcapp"}} .

  docker:push:
    desc: Build a multi-arch image (amd64 + arm64) and push it, e.g. task docker:push IMAGE=ghcr.io/you/tcapp:dev
    # A multi-arch result can't be loaded into the local image store, so it has to go to a registry.
    requires:
      vars: [IMAGE]
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64 --push -t {{.IMAGE}} .
